server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS — required because proxy_pass below uses a variable
    # ($og_token), which forces nginx to do runtime resolution.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self'; media-src 'self' https:; worker-src 'self' blob:; frame-src 'self' https://www.youtube.com https://www.youtube-nocookie.com; frame-ancestors 'none'" always;

    # Shared article links — route social-media crawlers to a backend endpoint
    # that returns per-article OpenGraph/Twitter meta tags. Real users continue
    # to the SPA below.
    location ~ ^/shared/(?<og_token>[^/?]+)$ {
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        if ($http_user_agent ~* "(facebookexternalhit|Discordbot|Slackbot|Twitterbot|LinkedInBot|TelegramBot|WhatsApp|Mastodon|Pinterest|Embedly|redditbot|Applebot|googlebot|bingbot|yandex|preview|opengraph)") {
            proxy_pass http://api:8000/api/shared/$og_token/og;
            break;
        }
        try_files $uri /index.html;
    }

    # SPA fallback — serve index.html for all non-file routes
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html must always revalidate. Without an explicit Cache-Control,
    # browsers heuristically cache it (10% of Last-Modified age), and a stale
    # copy references the previous build's hashed chunks — which the service
    # worker keeps serving from cache — stranding users on the old bundle
    # after a deploy. `expires` (not add_header) so the server-level security
    # headers are still inherited here.
    location = /index.html {
        expires -1;
    }

    # Proxy API requests to the backend.
    # `^~` makes this prefix take priority over the regex static-asset rule below;
    # without it, /api/telegram-media/123.jpg matches the *.jpg regex and tries to
    # serve from the SPA root instead of proxying to the API.
    location ^~ /api/ {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20M;
        # AI generation endpoints (e.g. /entries/daily-summary) routinely run
        # 30-90s. nginx's default proxy_read_timeout of 60s 504s them despite
        # gunicorn having a longer worker timeout. Match the gunicorn ceiling.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # The default-theme stylesheet blocks first paint (that is the point), so
    # it must not be able to hang the app shell if the API stops answering.
    location = /api/themes/default.css {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_connect_timeout 2s;
        proxy_read_timeout 3s;
    }

    # SSE endpoint needs special proxy settings
    location /api/events {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }

    # Proxy API documentation endpoints to the backend
    location /docs {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # The server-level CSP forbids third-party scripts, which blocks the
        # Swagger/ReDoc CDN bundles: two CSP headers are enforced as their
        # intersection, so the page renders as an empty shell. Declaring any
        # add_header here drops every inherited server-level one, and the api
        # already sets the full security-header set (with a docs-specific CSP
        # that allows the CDN) on these paths.
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /redoc {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # The server-level CSP forbids third-party scripts, which blocks the
        # Swagger/ReDoc CDN bundles: two CSP headers are enforced as their
        # intersection, so the page renders as an empty shell. Declaring any
        # add_header here drops every inherited server-level one, and the api
        # already sets the full security-header set (with a docs-specific CSP
        # that allows the CDN) on these paths.
        add_header X-Content-Type-Options "nosniff" always;
    }

    location /openapi.json {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;

        # The server-level CSP forbids third-party scripts, which blocks the
        # Swagger/ReDoc CDN bundles: two CSP headers are enforced as their
        # intersection, so the page renders as an empty shell. Declaring any
        # add_header here drops every inherited server-level one, and the api
        # already sets the full security-header set (with a docs-specific CSP
        # that allows the CDN) on these paths.
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Prometheus metrics — never served to the internet.
    #
    # This used to proxy to the api with an allow/deny ACL, but nginx matches
    # those against $remote_addr, which is the Caddy container's IP (always
    # RFC 1918), not the real client — so every external request passed. The
    # X-Real-IP the api checks was set from the same value, defeating that
    # gate too. Scrapers run inside the compose network and must hit
    # http://api:8000/metrics directly instead.
    location /metrics {
        return 404;
    }

    # Service worker — must never be cached so browsers detect updates
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Service-Worker-Allowed "/";
    }

    # Web manifest — short cache with proper MIME type
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache";
    }

    # Cache static assets (excluding sw.js handled above)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;
}
