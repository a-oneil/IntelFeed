    <script src="/theme-init.js"></script>

    <meta name="description" content="Security-focused RSS aggregator with AI-powered threat intelligence" />
    <meta name="mobile-web-app-capable" content="yes" />

    <meta property="og:description" content="Security-focused RSS aggregator with AI-powered threat intelligence" />
    <meta property="og:image" content="/icon-512.png" />

    <title>IntelFeed</title>

    <link rel="manifest" href="/manifest.webmanifest" />
