name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Found a security problem? Don't file it here. See [security.md](../blob/main/security.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected, and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to …
        2. Click …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The commit you're running (`git rev-parse --short HEAD` in the repo folder), and Docker or a local install.
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove passwords, tokens and hostnames first.
      render: text
