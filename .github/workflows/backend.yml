name: Backend

# Runs only when backend code actually changes. See the `changes` job below for
# why that gate is an `if:` on the jobs rather than `on.pull_request.paths` —
# the short version is that a workflow filtered out at the `on:` level never
# reports a status, so a branch-protection rule waits on it forever.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  # Supersede a PR's older run, but never kill a build of main — that run is
  # the record of whether the default branch is green.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # The version the Docker images ship (backend/Dockerfile). Used by the lint
  # and migration jobs; the test job runs a matrix (see `pytest`).
  PYTHON_VERSION: "3.12"

jobs:
  changes:
    name: changed?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Need the PR base commit in the local object store to diff against.
          fetch-depth: 0

      - id: filter
        name: Did this PR touch the backend?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          # A push to main (or a manual dispatch) always runs everything: main
          # must be verified end to end, not just on the slice that moved.
          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Event is '$EVENT' — running every backend check." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE" HEAD)

          if printf '%s\n' "$changed" | grep -qE '^(backend/|\.github/workflows/backend\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            verdict="Backend files changed — running backend checks."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            verdict="No backend files changed — skipping backend checks."
          fi

          {
            echo "### $verdict"
            echo
            echo '<details><summary>Files changed in this PR</summary>'
            echo
            echo '```'
            printf '%s\n' "$changed"
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  ruff:
    name: ruff
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Lint needs ruff only — skip the ~50-package runtime install.
      # Pinned exactly: ruff's formatter changes between releases, and an
      # unpinned install turns `ruff format --check` red on an unrelated PR the
      # day a new version ships. Bump deliberately, then run `ruff format .`.
      - name: Install ruff
        run: pipx install ruff==0.16.8

      - name: ruff check
        working-directory: backend
        run: ruff check --output-format=github .

      - name: ruff format --check
        working-directory: backend
        run: ruff format --check .

  pytest:
    name: pytest (py${{ matrix.python }})
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest

    # Both bugs this matrix would have caught were stdlib behaviour changes
    # (urllib.robotparser in 3.13, fnmatch.translate in 3.14) that only showed
    # up off the pinned version. The images ship 3.12; contributors run newer.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]

    services:
      postgres:
        # Must carry pgvector: conftest CREATEs the extension, and
        # entry_embeddings / story_threads declare halfvec columns.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: intelfeed
          POSTGRES_PASSWORD: intelfeed
          POSTGRES_DB: intelfeed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intelfeed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: intelfeed
      POSTGRES_PASSWORD: intelfeed
      POSTGRES_DB: intelfeed
      REDIS_URL: redis://localhost:6379/0
      # Meilisearch is patched off in conftest; no service needed.

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # WeasyPrint loads these through cffi at call time, so the PDF export
      # test fails with "cannot load library libgobject" without them. Same
      # set backend/Dockerfile installs.
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Generated per run rather than committed so nothing key-shaped lives in
      # the repo. Several modules reject the "changeme" defaults outright
      # (ENCRYPTION_KEY must parse as a Fernet key).
      - name: Generate ephemeral test keys
        run: |
          python -c "from cryptography.fernet import Fernet; print('ENCRYPTION_KEY=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"
          echo "SECRET_KEY=ci-only-$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: pytest
        working-directory: backend
        run: pytest tests/ -q

  alembic:
    name: alembic
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: intelfeed
          POSTGRES_PASSWORD: intelfeed
          POSTGRES_DB: intelfeed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intelfeed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: intelfeed
      POSTGRES_PASSWORD: intelfeed
      POSTGRES_DB: intelfeed
      REDIS_URL: redis://localhost:6379/0
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate ephemeral test keys
        run: |
          python -c "from cryptography.fernet import Fernet; print('ENCRYPTION_KEY=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"
          echo "SECRET_KEY=ci-only-$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      # Two heads means two migrations claim the same parent — the API
      # container then fails to start on `alembic upgrade head`.
      - name: Exactly one migration head
        working-directory: backend
        run: |
          heads=$(alembic heads 2>/dev/null | grep -c '(head)' || true)
          echo "heads: $heads"
          test "$heads" -eq 1

      - name: Migrate a fresh database to head
        working-directory: backend
        run: alembic upgrade head

      - name: Newest migration downgrades and re-applies
        working-directory: backend
        run: |
          alembic downgrade -1
          alembic upgrade head

  # One stable check to put in branch protection. It reports on every PR —
  # including ones that skip the backend entirely — so a required check never
  # hangs pending. Mark this job required, not the individual ones above.
  backend:
    name: Backend
    needs: [changes, ruff, pytest, alembic]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: No backend job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a backend job reported '$result'"; exit 1 ;;
            esac
          done
