name: Docker images

# The Dockerfiles are the supported install path for a self-hosted deploy, so a
# PR that breaks one breaks the product. They are slow to build (the backend
# image compiles lxml and installs a PostgreSQL client), so this only runs when
# something that feeds an image actually changes.
#
# The filter used to be two duplicated `on.*.paths` lists — GitHub Actions does
# not expand YAML anchors, so they had to be kept in sync by hand. It now lives
# once, in the `changes` job below, which also gives this workflow a status on
# every PR instead of silently not running.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changed?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: filter
        name: Did this PR touch anything that feeds an image?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Event is '$EVENT' — building every image." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Anything baked into an image or read by `compose config`. Note this
          # is deliberately narrower than `backend/**`: editing a Python module
          # does not change how the image builds, only what it contains, and
          # the backend workflow already tests that.
          pattern='^(backend/(Dockerfile|\.dockerignore|pyproject\.toml|entrypoint\.sh)'
          pattern="$pattern"'|frontend/(Dockerfile|\.dockerignore|package\.json|pnpm-lock\.yaml|nginx\.conf)'
          pattern="$pattern"'|db/Dockerfile'
          pattern="$pattern"'|docker-compose.*\.yml'
          pattern="$pattern"'|\.env\.example'
          pattern="$pattern"'|\.github/workflows/docker\.yml)$'

          changed=$(git diff --name-only "$BASE" HEAD)

          if printf '%s\n' "$changed" | grep -qE "$pattern"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            verdict="Image inputs changed — building images."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            verdict="No image inputs changed — skipping the image builds."
          fi

          {
            echo "### $verdict"
            echo
            echo '<details><summary>Files changed in this PR</summary>'
            echo
            echo '```'
            printf '%s\n' "$changed"
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: build ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: ./backend
            file: ./backend/Dockerfile
            target: production
          - name: frontend
            context: ./frontend
            file: ./frontend/Dockerfile
            target: ""
          - name: db
            context: ./db
            file: ./db/Dockerfile
            target: ""

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target }}
          push: false
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  compose:
    name: compose config
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # `compose config` resolves every interpolation, so a typo'd ${VAR} or a
      # malformed service block fails here instead of on someone's server.
      # Every service declares `env_file: - .env`, and `compose config` fails if
      # that file is absent — so a real .env has to exist here. `--env-file`
      # only redirects variable *interpolation*; it does not satisfy the
      # service-level directive. A fresh CI checkout has no .env, so writing one
      # is safe (never do this on a developer machine — it would clobber theirs).
      - name: Validate dev and prod compose
        run: |
          cp .env.example .env
          # .env.example ships SITE_DOMAIN empty, but prod marks it required
          # (${SITE_DOMAIN:?}). Give it a placeholder purely to interpolate.
          sed -i 's|^SITE_DOMAIN=.*|SITE_DOMAIN=ci.example.com|' .env
          docker compose -f docker-compose.dev.yml config --quiet
          docker compose -f docker-compose.prod.yml config --quiet

  # Stable check for branch protection — see the matching job in backend.yml.
  docker:
    name: Docker images
    needs: [changes, build, compose]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: No image job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a Docker job reported '$result'"; exit 1 ;;
            esac
          done
