name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# A second push to the same PR cancels the first run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The version the Docker images ship (backend/Dockerfile). Used by the lint
  # and migration jobs; the test job runs a matrix (see backend-test).
  PYTHON_VERSION: "3.12"
  # frontend/Dockerfile builds on node:22 with pnpm 10.
  NODE_VERSION: "22"

jobs:
  backend-lint:
    name: Backend · ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Lint needs ruff only — skip the ~50-package runtime install.
      # Pinned exactly: ruff's formatter changes between releases, and an
      # unpinned install turns `ruff format --check` red on an unrelated PR the
      # day a new version ships. Bump deliberately, then run `ruff format .`.
      - name: Install ruff
        run: pipx install ruff==0.16.8

      - name: ruff check
        working-directory: backend
        run: ruff check --output-format=github .

      - name: ruff format --check
        working-directory: backend
        run: ruff format --check .

  backend-test:
    name: Backend · pytest (py${{ matrix.python }})
    runs-on: ubuntu-latest

    # Both bugs this matrix would have caught were stdlib behaviour changes
    # (urllib.robotparser in 3.13, fnmatch.translate in 3.14) that only showed
    # up off the pinned version. The images ship 3.12; contributors run newer.
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]

    services:
      postgres:
        # Must carry pgvector: conftest CREATEs the extension, and
        # entry_embeddings / story_threads declare halfvec columns.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: intelfeed
          POSTGRES_PASSWORD: intelfeed
          POSTGRES_DB: intelfeed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intelfeed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: intelfeed
      POSTGRES_PASSWORD: intelfeed
      POSTGRES_DB: intelfeed
      REDIS_URL: redis://localhost:6379/0
      # Meilisearch is patched off in conftest; no service needed.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # WeasyPrint loads these through cffi at call time, so the PDF export
      # test fails with "cannot load library libgobject" without them. Same
      # set backend/Dockerfile installs.
      - name: Install WeasyPrint system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libpango-1.0-0 libpangocairo-1.0-0 libgdk-pixbuf-2.0-0 libcairo2

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # Generated per run rather than committed so nothing key-shaped lives in
      # the repo. Several modules reject the "changeme" defaults outright
      # (ENCRYPTION_KEY must parse as a Fernet key).
      - name: Generate ephemeral test keys
        run: |
          python -c "from cryptography.fernet import Fernet; print('ENCRYPTION_KEY=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"
          echo "SECRET_KEY=ci-only-$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      - name: pytest
        working-directory: backend
        run: pytest tests/ -q

  backend-migrations:
    name: Backend · alembic
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: intelfeed
          POSTGRES_PASSWORD: intelfeed
          POSTGRES_DB: intelfeed
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U intelfeed"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

    env:
      POSTGRES_HOST: localhost
      POSTGRES_PORT: 5432
      POSTGRES_USER: intelfeed
      POSTGRES_PASSWORD: intelfeed
      POSTGRES_DB: intelfeed
      REDIS_URL: redis://localhost:6379/0
      PYTHONPATH: .

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Generate ephemeral test keys
        run: |
          python -c "from cryptography.fernet import Fernet; print('ENCRYPTION_KEY=' + Fernet.generate_key().decode())" >> "$GITHUB_ENV"
          echo "SECRET_KEY=ci-only-$(openssl rand -hex 16)" >> "$GITHUB_ENV"

      # Two heads means two migrations claim the same parent — the API
      # container then fails to start on `alembic upgrade head`.
      - name: Exactly one migration head
        working-directory: backend
        run: |
          heads=$(alembic heads 2>/dev/null | grep -c '(head)' || true)
          echo "heads: $heads"
          test "$heads" -eq 1

      - name: Migrate a fresh database to head
        working-directory: backend
        run: alembic upgrade head

      - name: Newest migration downgrades and re-applies
        working-directory: backend
        run: |
          alembic downgrade -1
          alembic upgrade head

  frontend:
    name: Frontend · lint, test, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      # Version comes from package.json "packageManager".
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Fails the PR if package.json changed without a lockfile update.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

      - name: Vitest
        run: pnpm test

      # `pnpm build` is `tsc -b && vite build` — this is the type check too.
      - name: Type check and build
        run: pnpm build
