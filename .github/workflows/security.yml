name: Security

# Three gates, on different cadences:
#
#   gitleaks   — every PR. A committed credential is diff-local: it is this
#                PR's fault, and the fix is this PR's job.
#   pip-audit  — only when backend/pyproject.toml moves, plus a weekly sweep.
#   pnpm audit — only when the frontend manifest or lockfile moves, ditto.
#
# The dependency audits are deliberately *not* on every PR. They grade the
# repo's dependency state, not the diff, so running them per-PR just turns a
# CSS change red the morning a new advisory lands against lxml. The weekly
# sweep is what catches advisories filed against dependencies nobody touched.
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Mondays 07:00 UTC — a fresh advisory list at the start of the week.
    - cron: "0 7 * * 1"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  changes:
    name: changed?
    runs-on: ubuntu-latest
    outputs:
      python: ${{ steps.filter.outputs.python }}
      node: ${{ steps.filter.outputs.node }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        name: Did this PR touch a dependency manifest?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT" != "pull_request" ]; then
            echo "python=true" >> "$GITHUB_OUTPUT"
            echo "node=true" >> "$GITHUB_OUTPUT"
            echo "Event is '$EVENT' — auditing every dependency tree." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE" HEAD)

          match() { printf '%s\n' "$changed" | grep -qE "$1"; }

          if match '^(backend/pyproject\.toml|\.github/workflows/security\.yml)$'; then
            echo "python=true" >> "$GITHUB_OUTPUT"
          else
            echo "python=false" >> "$GITHUB_OUTPUT"
          fi

          if match '^(frontend/(package\.json|pnpm-lock\.yaml)|\.github/workflows/security\.yml)$'; then
            echo "node=true" >> "$GITHUB_OUTPUT"
          else
            echo "node=false" >> "$GITHUB_OUTPUT"
          fi

  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # The upstream gitleaks-action wants a GITLEAKS_LICENSE for anything that
      # is not a public repo; the binary itself is MIT and has no such gate, so
      # install it straight from the release. Pinned — a new default rule in a
      # minor release would otherwise turn an unrelated PR red.
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          set -euo pipefail
          curl -sSL --fail \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Scans the checked-out tree rather than history: what matters for a PR
      # is that the code it lands is clean. Auditing the full history is a
      # one-off job (`gitleaks git .`), not a per-PR gate.
      #
      # Findings are real often enough to block on. If one is a placeholder,
      # add it to .gitleaks.toml with a comment saying why — do not silence the
      # rule wholesale.
      - name: Scan for committed secrets
        run: gitleaks dir . --config .gitleaks.toml --redact --no-banner --verbose

  pip-audit:
    name: pip-audit
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          # The version the images ship — audit what actually gets deployed.
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      # Resolve the dependency tree without building the project: --dry-run
      # --report gives the exact set pip would install, and pip-audit reads the
      # pinned list. Far faster than a real install, and it audits the *fresh*
      # resolution rather than whatever a cached environment happens to hold.
      - name: Resolve backend dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install --dry-run --ignore-installed --quiet \
            --report resolved.json "./backend[dev]"
          python - <<'PY'
          import json

          with open("resolved.json") as fh:
              report = json.load(fh)

          pins = sorted(
              f"{item['metadata']['name']}=={item['metadata']['version']}"
              for item in report["install"]
              if item["metadata"]["name"].lower() != "intelfeed"
          )
          with open("resolved.txt", "w") as fh:
              fh.write("\n".join(pins) + "\n")
          print(f"resolved {len(pins)} packages")
          PY

      - name: Install pip-audit
        run: pipx install pip-audit==2.10.1

      # --ignore-vuln is for advisories with no upstream fix. Every entry needs
      # a comment naming the package, why it is unfixable, and what pulls it
      # in — otherwise this list silently becomes the place vulnerabilities go
      # to be forgotten. Anything with a fix version available gets upgraded,
      # not ignored.
      #
      #   PYSEC-2026-1325  ecdsa — side-channel in signature verification.
      #                    Upstream declines to fix (pure-Python ECDSA cannot
      #                    be made constant-time). Reaches us through
      #                    python-jose[cryptography], which only uses ecdsa for
      #                    ES* JWT algorithms; IntelFeed signs its tokens with
      #                    HS256, so the vulnerable path is not exercised.
      - name: Audit backend dependencies
        run: |
          pip-audit -r resolved.txt \
            --progress-spinner off \
            --ignore-vuln PYSEC-2026-1325

  pnpm-audit:
    name: pnpm audit
    needs: changes
    if: needs.changes.outputs.node == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # `pnpm audit` resolves from the lockfile, so no install is needed.
      #
      # --prod is the gate: those are the packages that end up in the bundle a
      # browser executes. Every high-severity advisory in this tree today is in
      # the dev tree instead (eslint, stylelint, jsdom) — real debt, but not
      # something that should block an unrelated PR, so it is reported below
      # rather than enforced.
      - name: Audit shipped dependencies
        run: pnpm audit --prod --audit-level=high

      - name: Report dev-tree advisories
        if: always()
        continue-on-error: true
        run: |
          {
            echo "### Dev-dependency advisories (not a gate)"
            echo
            echo '```'
            pnpm audit --audit-level=high 2>&1 | tail -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Stable check for branch protection — see the matching job in backend.yml.
  security:
    name: Security
    needs: [changes, gitleaks, pip-audit, pnpm-audit]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: No security job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a security job reported '$result'"; exit 1 ;;
            esac
          done
