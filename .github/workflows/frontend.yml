name: Frontend

# Same shape as backend.yml: a `changes` job decides whether the real jobs run,
# and a final aggregate job always reports so branch protection has something
# stable to require.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # frontend/Dockerfile builds on node:22 with pnpm 10.
  NODE_VERSION: "22"

jobs:
  changes:
    name: changed?
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: filter
        name: Did this PR touch the frontend?
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail

          if [ "$EVENT" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            echo "Event is '$EVENT' — running every frontend check." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          changed=$(git diff --name-only "$BASE" HEAD)

          if printf '%s\n' "$changed" | grep -qE '^(frontend/|\.github/workflows/frontend\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            verdict="Frontend files changed — running frontend checks."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            verdict="No frontend files changed — skipping frontend checks."
          fi

          {
            echo "### $verdict"
            echo
            echo '<details><summary>Files changed in this PR</summary>'
            echo
            echo '```'
            printf '%s\n' "$changed"
            echo '```'
            echo
            echo '</details>'
          } >> "$GITHUB_STEP_SUMMARY"

  eslint:
    name: eslint
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      # Version comes from "packageManager" in frontend/package.json. The path
      # is explicit because this is a `uses:` step — the job's
      # defaults.run.working-directory applies only to `run:` steps, so the
      # action would otherwise look for a package.json at the repo root, where
      # there isn't one.
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      # Fails the PR if package.json changed without a lockfile update.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: ESLint
        run: pnpm lint

  vitest:
    name: vitest
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Vitest
        run: pnpm test

  build:
    name: type check & build
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Install
        run: pnpm install --frozen-lockfile

      # `pnpm build` is `tsc -b && vite build` — this is the type check too.
      - name: Type check and build
        run: pnpm build

      # A quick read on bundle weight, in the job summary. Not a gate: there is
      # no agreed budget yet, and a failing build already blocks the PR.
      - name: Bundle size
        run: |
          {
            echo "### Built assets (largest 15)"
            echo
            echo '```'
            du -ah dist/assets 2>/dev/null | sort -rh | head -15
            echo
            echo "total: $(du -sh dist | cut -f1)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Stable check for branch protection — see the matching job in backend.yml.
  frontend:
    name: Frontend
    needs: [changes, eslint, vitest, build]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: No frontend job failed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          set -euo pipefail
          echo "job results: $RESULTS"
          for result in $RESULTS; do
            case "$result" in
              success|skipped) ;;
              *) echo "::error::a frontend job reported '$result'"; exit 1 ;;
            esac
          done
