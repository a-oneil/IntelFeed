[project]
name = "intelfeed"
version = "0.1.0"
requires-python = ">=3.12"

dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "gunicorn>=21",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "alembic>=1.13",
    "pydantic[email]>=2.6",
    "pydantic-settings>=2.1",
    "python-jose[cryptography]>=3.3",
    "bcrypt>=4.1",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "curl_cffi>=0.9",
    "feedparser>=6.0",
    "readability-lxml>=0.8",
    "lxml>=5.1",
    "celery[redis]>=5.3",
    "redis>=5.0",
    "meilisearch>=0.31",
    "nh3>=0.2",
    "markdown>=3.5",
    "sse-starlette>=3.4.11",
    "cryptography>=42.0",
    "defusedxml>=0.7",
    "Pillow>=10.0",
    "Jinja2>=3.1",
    "structlog>=24.1",
    "prometheus-client>=0.21",
    "sentry-sdk[fastapi]>=2.0",
    "youtube-transcript-api>=0.6",
    "pyahocorasick>=2.0",
    "anthropic>=1.8.0",
    "claude-agent-sdk>=0.1",
    "weasyprint>=62.0",
    "wikipedia-api>=0.7.1",
    "pymupdf>=1.24",
    "telethon>=1.34",
    "googlenewsdecoder>=0.2.1",
    "jsonschema>=4.21",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
    "pytest-timeout>=2.4.0",
    "pytest-xdist>=3.5",
    "httpx>=0.27",
    "factory-boy>=3.3",
    "ruff>=0.3",
]

[build-system]
requires = ["setuptools>=69.0"]
build-backend = "setuptools.build_meta"

# Without this, setuptools' flat-layout auto-discovery sees `app`, `alembic` and
# `tests` side by side and refuses to build:
#   error: Multiple top-level packages discovered in a flat-layout
# which breaks `pip install -e ".[dev]"` on any recent setuptools. Only `app`
# is the importable package; alembic/ and tests/ are run in place.
[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Router imports intentionally live below `app = FastAPI(...)` so the app
# object and middleware exist before routers are wired up.
"app/main.py" = ["E402"]
# Migrations are frozen history; several seed reference prose (glossary terms,
# MITRE descriptions) that cannot be rewrapped without editing the seeded data.
"alembic/versions/*" = ["E501"]
# Prompt bodies live inside triple-quoted strings where a line break is part of
# the prompt text — rewrapping them would change what the model receives.
"app/ai/prompts/defaults.py" = ["E501"]

[tool.ruff.format]
# Hand-wrapped at a narrower width than ruff's 120 on purpose — left alone so a
# formatting sweep doesn't collapse them back into single long lines.
exclude = [
    "app/schemas/auth.py",
    "tests/test_auth.py",
    "tests/test_dashboards.py",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
# One event loop for the whole session so the engine and its connection pool
# survive across tests; a per-test loop invalidates pooled connections.
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
# No test should ever hang the suite. Raise per-test with @pytest.mark.timeout.
timeout = 60
timeout_method = "thread"
markers = [
    "committed_db: test needs data committed and visible to other connections (skips rollback isolation)",
]
